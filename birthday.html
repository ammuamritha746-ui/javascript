<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    let friend = { name:"john",
    birth:"1999-07-05"};
    function getBirthdayDetails(hello){
        let date = new Date(hello.birth);
        let year = date.getFullYear();
         let months =[ "january","February","March","April","june","july","August","SEPTEMBER"]
        let month = months[date.getMonth()];
        let day = date.getDate();
        let today = new Date();
        let age =  today.getFullYear()-year;
        console.log(hello.name +"was born on" + day + " "+ month +" " + year + " and is " + age + "years old." );

    }
    getBirthdayDetails(friend);
    </script>
</body>
